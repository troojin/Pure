<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pure Embedded Debug Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="debug-menu">
        <header>Debug Tools <span>embedded Pure</span></header>
        <label><input id="wireframe" type="checkbox"> Wireframe mode</label>
        <label><input id="pause" type="checkbox"> Pause simulation</label>
        <button id="inspect" type="button">Inspect selected object</button>
        <p id="reply">Mode: Solid | Sim: Running | Inspects: 0</p>
    </section>
    <script src="app.js"></script>
</body>
</html>
